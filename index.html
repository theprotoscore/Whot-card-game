<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Whot card game</title>
  </head>
  <body>
    <h3>Computer:</h3>
    <div id="computer-cards"></div>

    <div class="top-cards-container" id="top-cards-container">
      <img
        src="cards/whot_box_front_pixel.svg"
        alt="whot_box_front"
        class="whot-brand"
      />
      <img src="cards/card_back.svg" alt="whot_box_front" class="whot-brand" />
    </div>

    <h3>Your cards:</h3>
    <div id="your-cards"></div>

    <script src="./script.js"></script>
  </body>
</html>
